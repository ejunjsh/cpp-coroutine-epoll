name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Release]
        compiler:
          - { c: gcc,   cpp: g++ }
          - { c: clang, cpp: clang++ }

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: >
        cmake -B build
        -DCMAKE_C_COMPILER=${{ matrix.compiler.c }}
        -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cpp }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: Smoke test (echo_server --help)
      run: |
        # Start echo_server in background
        ./build/echo_server 9999 &
        SERVER_PID=$!
        sleep 1

        # Send a line and expect it echoed back
        echo "hello" | nc -w 2 127.0.0.1 9999 | grep -q "hello" && echo "PASS" || echo "FAIL"

        # Cleanup
        kill $SERVER_PID 2>/dev/null || true
        wait $SERVER_PID 2>/dev/null || true
